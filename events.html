<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Events — SafariQuest Kenya</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green: #1a3c2e; --orange: #E8732A; --gold: #C9973A;
      --light: #f7f5f0; --white: #fff; --text: #333; --muted: #777;
    }
    body { font-family: 'DM Sans', sans-serif; color: var(--text); background: var(--light); }

    /* HERO */
    .hero { position: relative; height: 320px; overflow: hidden; display: flex; align-items: center; justify-content: center; text-align: center; }
    .hero-bg { position: absolute; inset: 0; background: url('https://images.unsplash.com/photo-1531058020387-3be344556be6?w=1400&q=85') center/cover no-repeat; filter: brightness(.45); }
    .hero-content { position: relative; z-index: 2; color: var(--white); padding: 0 20px; }
    .hero-badge { display: inline-block; background: var(--orange); color: var(--white); padding: 5px 16px; border-radius: 20px; font-size: .8rem; font-weight: 700; letter-spacing: .04em; margin-bottom: 14px; }
    .hero-title { font-family: 'Playfair Display', serif; font-size: 2.6rem; margin-bottom: 10px; }
    .hero-sub { font-size: 1rem; opacity: .85; max-width: 520px; }

    /* FILTERS */
    .filter-bar { max-width: 1200px; margin: 30px auto 0; padding: 0 24px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .filter-select { padding: 9px 14px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: .88rem; font-family: inherit; color: var(--text); background: var(--white); cursor: pointer; }
    .filter-select:focus { outline: none; border-color: var(--orange); }
    .btn-clear { padding: 9px 18px; background: transparent; border: 2px solid #ccc; border-radius: 10px; font-size: .85rem; cursor: pointer; color: var(--muted); font-family: inherit; }
    .btn-clear:hover { border-color: var(--orange); color: var(--orange); }

    /* PILLS */
    .pills { max-width: 1200px; margin: 16px auto 0; padding: 0 24px; display: flex; gap: 10px; flex-wrap: wrap; }
    .pill { padding: 7px 18px; border: 2px solid #e0e0e0; border-radius: 20px; font-size: .83rem; cursor: pointer; background: var(--white); font-family: inherit; font-weight: 500; transition: all .2s; }
    .pill.active, .pill:hover { background: var(--orange); border-color: var(--orange); color: var(--white); }

    /* GRID */
    .main-content { max-width: 1200px; margin: 32px auto 60px; padding: 0 24px; }
    .section-title { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: var(--green); margin-bottom: 24px; display: flex; align-items: center; gap: 14px; }
    .source-badge { font-size: .72rem; font-family: 'DM Sans', sans-serif; font-weight: 600; padding: 3px 10px; border-radius: 20px; background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
    .events-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }
    .event-card { background: var(--white); border-radius: 16px; overflow: hidden; box-shadow: 0 4px 18px rgba(0,0,0,.07); transition: transform .25s, box-shadow .25s; display: flex; flex-direction: column; }
    .event-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,.13); }
    .event-img { width: 100%; height: 190px; object-fit: cover; background: #e0e0e0; }
    .event-body { padding: 18px; flex: 1; display: flex; flex-direction: column; }
    .event-cat { display: inline-block; background: var(--orange)22; color: var(--orange); padding: 3px 10px; border-radius: 20px; font-size: .73rem; font-weight: 700; margin-bottom: 8px; text-transform: capitalize; }
    .tm-badge { display: inline-block; background: #e3f2fd; color: #1565c0; padding: 3px 8px; border-radius: 20px; font-size: .68rem; font-weight: 700; margin-left: 6px; }
    .event-name { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: var(--green); margin-bottom: 8px; }
    .event-desc { font-size: .85rem; color: var(--muted); line-height: 1.55; margin-bottom: 14px; flex: 1; }
    .event-meta { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    .event-meta span { font-size: .78rem; color: #555; background: #f0f0f0; padding: 3px 8px; border-radius: 6px; }
    .event-footer { display: flex; justify-content: space-between; align-items: center; }
    .event-price { font-weight: 700; color: var(--green); font-size: .95rem; }
    .btn-book-event { padding: 8px 18px; background: var(--orange); color: var(--white); border: none; border-radius: 8px; font-size: .83rem; font-weight: 600; cursor: pointer; font-family: inherit; transition: background .2s; text-decoration: none; display: inline-block; }
    .btn-book-event:hover { background: #c9621e; }

    /* LOADING */
    .loading-state { text-align: center; padding: 60px 20px; color: var(--muted); }
    .spinner { width: 40px; height: 40px; border: 4px solid #e0e0e0; border-top-color: var(--orange); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* EMPTY */
    .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty-state .icon { font-size: 3.5rem; margin-bottom: 12px; }

    /* BOOKING MODAL */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
    .modal-backdrop.open { display: flex; }
    .modal { background: var(--white); border-radius: 20px; max-width: 400px; width: 100%; padding: 28px; animation: slideUp .3s ease; }
    @keyframes slideUp { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }
    .modal h3 { font-family: 'Playfair Display', serif; color: var(--green); margin-bottom: 16px; font-size: 1.3rem; }
    .modal label { display: block; font-size: .82rem; font-weight: 600; color: #555; margin-bottom: 4px; margin-top: 12px; }
    .modal input, .modal select { width: 100%; padding: 10px 12px; border: 2px solid #e0e0e0; border-radius: 9px; font-size: .9rem; font-family: inherit; }
    .modal input:focus, .modal select:focus { outline: none; border-color: var(--orange); }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .btn-confirm { flex: 1; padding: 12px; background: var(--orange); color: var(--white); border: none; border-radius: 10px; font-size: .9rem; font-weight: 700; cursor: pointer; font-family: inherit; }
    .btn-cancel  { flex: 1; padding: 12px; background: #f0f0f0; color: #555; border: none; border-radius: 10px; font-size: .9rem; cursor: pointer; font-family: inherit; }
    .mpesa-box { background: #e8f5e9; border-radius: 10px; padding: 14px; margin-top: 14px; display: none; text-align: center; }
    .mpesa-box .mpesa-title { font-weight: 700; color: #2e7d32; margin-bottom: 4px; }
    .mpesa-box .mpesa-sub { font-size: .8rem; color: #555; }
    .mpesa-box .tx-id { font-size: 1.1rem; font-weight: 800; letter-spacing: 2px; color: #1b5e20; margin-top: 8px; }

    @media (max-width: 768px) {
      .hero-title { font-size: 1.8rem; }
    }
  </style>
</head>
<body data-nav-active="events">

<div id="sq-nav-root"></div>

<!-- HERO -->
<div class="hero">
  <div class="hero-bg"></div>
  <div class="hero-content">
    <div class="hero-badge">🎉 Kenya Events Calendar</div>
    <h1 class="hero-title">Discover Events & Festivals</h1>
    <p class="hero-sub">From world-famous wildlife spectacles to vibrant cultural festivals across Kenya</p>
  </div>
</div>

<!-- FILTER BAR -->
<div class="filter-bar">
  <select class="filter-select" id="catFilter" onchange="applyFilters()">
    <option value="all">All Categories</option>
    <option value="wildlife">Wildlife</option>
    <option value="cultural">Cultural</option>
    <option value="sports">Sports</option>
    <option value="music">Music & Arts</option>
    <option value="food">Food & Drink</option>
    <option value="other">Other</option>
  </select>
  <select class="filter-select" id="monthFilter" onchange="applyFilters()">
    <option value="all">All Months</option>
    <option value="01">January</option>
    <option value="02">February</option>
    <option value="03">March</option>
    <option value="04">April</option>
    <option value="05">May</option>
    <option value="06">June</option>
    <option value="07">July</option>
    <option value="08">August</option>
    <option value="09">September</option>
    <option value="10">October</option>
    <option value="11">November</option>
    <option value="12">December</option>
  </select>
  <button class="btn-clear" onclick="clearFilters()">Clear Filters</button>
</div>

<!-- CATEGORY PILLS -->
<div class="pills" id="pillsRow">
  <button class="pill active" onclick="setPill(this,'all')">All Events</button>
  <button class="pill" onclick="setPill(this,'wildlife')">🦁 Wildlife</button>
  <button class="pill" onclick="setPill(this,'cultural')">🥁 Cultural</button>
  <button class="pill" onclick="setPill(this,'sports')">🏎️ Sports</button>
  <button class="pill" onclick="setPill(this,'music')">🎵 Music & Arts</button>
  <button class="pill" onclick="setPill(this,'food')">🍽️ Food & Drink</button>
</div>

<!-- MAIN CONTENT -->
<div class="main-content">
  <h2 class="section-title" id="gridTitle">
    All Events
    <span class="source-badge" id="sourceBadge" style="display:none"></span>
  </h2>
  <div class="events-grid" id="eventsGrid">
    <div class="loading-state" style="grid-column:1/-1">
      <div class="spinner"></div>
      <p>Loading Kenya events…</p>
    </div>
  </div>
</div>

<!-- BOOKING MODAL -->
<div class="modal-backdrop" id="bookingModal">
  <div class="modal">
    <h3>🎟️ Reserve Your Spot</h3>
    <p id="modalEventName" style="color:#E8732A;font-weight:600;margin-bottom:4px;font-size:.9rem"></p>
    <label>Your Name</label>
    <input type="text" id="modalName" placeholder="Full name">
    <label>Email</label>
    <input type="email" id="modalEmail" placeholder="your@email.com">
    <label>Number of Tickets</label>
    <select id="modalTickets">
      <option>1</option><option>2</option><option>3</option><option>4</option><option>5+</option>
    </select>
    <label>Event Date</label>
    <input type="text" id="modalDate" readonly style="background:#f5f5f5;color:#666">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-confirm" onclick="confirmBooking()">Confirm & Pay</button>
    </div>
    <div class="mpesa-box" id="mpesaBox">
      <div class="mpesa-title">🟢 M-Pesa Payment Sent</div>
      <div class="mpesa-sub">Enter your M-Pesa PIN on your phone to complete payment</div>
      <div class="tx-id" id="mpesaTxId"></div>
      <div style="margin-top:12px">
        <a href="dashboard.html" style="display:inline-block;padding:8px 20px;background:#2e7d32;color:#fff;border-radius:8px;text-decoration:none;font-size:.82rem;font-weight:600">View My Bookings →</a>
      </div>
    </div>
  </div>
</div>

<div id="sq-footer-root"></div>

<script src="auth.js"></script>
<script>
  /* ── CONFIG ── */
  var TM_KEY       = 'k6nk9YzYyElGsC9dsDstdtjTCfoawFEo';
  var SB_URL       = 'https://cbyipmrozqsntojiartw.supabase.co';
  var SB_ANON_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNieWlwbXJvenFzbnRvamlhcnR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMzOTkxNTQsImV4cCI6MjA4ODk3NTE1NH0.31TAhmUCV_Uh0W8FGnR2_TLCZDU4YBM1U5LMSMc5JZs';

  /* ── STATE ── */
  var ALL_EVENTS  = [];   // full loaded list
  var filtered    = [];   // currently shown
  var currentEvent = null;

  /* ════════════════════════════════
     DATA LOADING
  ════════════════════════════════ */

  async function loadEvents() {
    showLoading();

    var results = await Promise.allSettled([
      fetchTicketmaster(),
      fetchSupabase()
    ]);

    var tmEvents = results[0].status === 'fulfilled' ? results[0].value : [];
    var sbEvents = results[1].status === 'fulfilled' ? results[1].value : [];

    ALL_EVENTS = mergeEvents(tmEvents, sbEvents);

    if (ALL_EVENTS.length === 0) {
      showEmpty('No Kenya events found right now. Check back soon!');
      return;
    }

    // Show source badge
    var badge = document.getElementById('sourceBadge');
    if (tmEvents.length > 0 && sbEvents.length > 0) {
      badge.textContent = '✓ Live: Ticketmaster + SafariQuest';
    } else if (tmEvents.length > 0) {
      badge.textContent = '✓ Live: Ticketmaster';
    } else {
      badge.textContent = '✓ SafariQuest Curated';
    }
    badge.style.display = 'inline-block';

    filtered = ALL_EVENTS.slice();
    renderGrid();
  }

  /* Fetch from Ticketmaster Discovery API */
  async function fetchTicketmaster() {
    var url = 'https://app.ticketmaster.com/discovery/v2/events.json' +
      '?apikey=' + TM_KEY +
      '&countryCode=KE' +
      '&size=20' +
      '&sort=date,asc';

    var res = await fetch(url);
    if (!res.ok) return [];

    var data = await res.json();
    var events = (data._embedded && data._embedded.events) ? data._embedded.events : [];

    return events.map(function(e) {
      var venue = e._embedded && e._embedded.venues && e._embedded.venues[0];
      var city  = venue && venue.city ? venue.city.name : 'Kenya';
      var img   = e.images ? e.images.find(function(i){ return i.ratio === '16_9' && i.width > 500; }) : null;
      var cat   = e.classifications && e.classifications[0] ?
                  (e.classifications[0].segment && e.classifications[0].segment.name
                   ? e.classifications[0].segment.name.toLowerCase() : 'other') : 'other';

      return {
        id:          'tm_' + e.id,
        name:        e.name,
        category:    normCategory(cat),
        month:       e.dates && e.dates.start ? e.dates.start.localDate.substring(5,7) : '00',
        date:        e.dates && e.dates.start ? formatDate(e.dates.start.localDate) : 'Date TBC',
        rawDate:     e.dates && e.dates.start ? e.dates.start.localDate : '',
        location:    city + ', Kenya',
        price:       e.priceRanges ? 'KSh ' + Math.round(e.priceRanges[0].min).toLocaleString() : 'See site',
        description: e.info || e.pleaseNote || 'Visit the Ticketmaster listing for full event details.',
        image:       img ? img.url : 'https://images.unsplash.com/photo-1531058020387-3be344556be6?w=600&q=80',
        source_url:  e.url || '#',
        source:      'ticketmaster'
      };
    });
  }

  /* Fetch from Supabase events table */
  async function fetchSupabase() {
    var today = new Date().toISOString().split('T')[0];
    var url   = SB_URL + '/rest/v1/events?event_date=gte.' + today + '&order=event_date.asc';

    var res = await fetch(url, {
      headers: {
        'apikey':        SB_ANON_KEY,
        'Authorization': 'Bearer ' + SB_ANON_KEY
      }
    });

    if (!res.ok) return [];
    var data = await res.json();
    if (!Array.isArray(data)) return [];

    return data.map(function(e) {
      return {
        id:          'sb_' + e.id,
        name:        e.title,
        category:    normCategory(e.category || 'other'),
        month:       e.event_date ? e.event_date.substring(5,7) : '00',
        date:        e.event_date ? formatDate(e.event_date) : 'Date TBC',
        rawDate:     e.event_date || '',
        location:    e.location || 'Kenya',
        price:       e.is_free ? 'Free entry' : (e.price ? 'KSh ' + Number(e.price).toLocaleString() : 'See site'),
        description: e.description || '',
        image:       e.image_url || 'https://images.unsplash.com/photo-1516426122078-c23e76319801?w=600&q=80',
        source_url:  e.source_url || '#',
        source:      'supabase'
      };
    });
  }

  /* Merge: Supabase first (curated), then Ticketmaster on top, dedupe by name */
  function mergeEvents(tmEvents, sbEvents) {
    var seen   = {};
    var merged = [];

    sbEvents.concat(tmEvents).forEach(function(e) {
      var key = e.name.toLowerCase().trim();
      if (!seen[key]) {
        seen[key] = true;
        merged.push(e);
      }
    });

    // Sort by date ascending
    merged.sort(function(a, b) {
      if (!a.rawDate) return 1;
      if (!b.rawDate) return -1;
      return a.rawDate.localeCompare(b.rawDate);
    });

    return merged;
  }

  /* ════════════════════════════════
     RENDER
  ════════════════════════════════ */

  function renderGrid() {
    var grid = document.getElementById('eventsGrid');

    if (!filtered.length) {
      grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="icon">🎟️</div><p>No events match your filters. Try clearing them.</p></div>';
      return;
    }

    grid.innerHTML = filtered.map(function(ev) {
      var tmBadge = ev.source === 'ticketmaster' ? '<span class="tm-badge">🎟 Ticketmaster</span>' : '';
      var btnLabel = ev.source === 'ticketmaster' ? 'Get Tickets' : 'Book Now';
      var btnAttr  = ev.source === 'ticketmaster'
        ? 'href="' + ev.source_url + '" target="_blank" class="btn-book-event"'
        : 'onclick="openModal(\'' + ev.id + '\')" class="btn-book-event"';

      return '<div class="event-card" data-category="' + ev.category + '" data-month="' + ev.month + '">' +
        '<img class="event-img" src="' + ev.image + '" alt="' + ev.name + '" loading="lazy" ' +
          'onerror="this.src=\'https://images.unsplash.com/photo-1531058020387-3be344556be6?w=600&q=80\'">' +
        '<div class="event-body">' +
          '<span class="event-cat">' + ev.category + '</span>' + tmBadge +
          '<div class="event-name">' + ev.name + '</div>' +
          '<div class="event-desc">' + ev.description + '</div>' +
          '<div class="event-meta">' +
            '<span>📅 ' + ev.date + '</span>' +
            '<span>📍 ' + ev.location + '</span>' +
          '</div>' +
          '<div class="event-footer">' +
            '<span class="event-price">' + ev.price + '</span>' +
            '<a ' + btnAttr + '>' + btnLabel + '</a>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  function showLoading() {
    document.getElementById('eventsGrid').innerHTML =
      '<div class="loading-state" style="grid-column:1/-1"><div class="spinner"></div><p>Loading Kenya events…</p></div>';
  }

  function showEmpty(msg) {
    document.getElementById('eventsGrid').innerHTML =
      '<div class="empty-state" style="grid-column:1/-1"><div class="icon">🎟️</div><p>' + msg + '</p></div>';
  }

  /* ════════════════════════════════
     FILTERS
  ════════════════════════════════ */

  function applyFilters() {
    var cat   = document.getElementById('catFilter').value;
    var month = document.getElementById('monthFilter').value;

    filtered = ALL_EVENTS.filter(function(ev) {
      return (cat   === 'all' || ev.category === cat) &&
             (month === 'all' || ev.month    === month);
    });

    var title = 'All Events';
    if (cat !== 'all')   title = cap(cat) + ' Events';
    if (month !== 'all') title += (cat !== 'all' ? ' · ' : '') + monthName(month);
    document.getElementById('gridTitle').childNodes[0].textContent = title + ' ';

    renderGrid();
  }

  function setPill(el, cat) {
    document.querySelectorAll('.pill').forEach(function(p) { p.classList.remove('active'); });
    el.classList.add('active');
    document.getElementById('catFilter').value = cat;
    applyFilters();
  }

  function clearFilters() {
    document.getElementById('catFilter').value   = 'all';
    document.getElementById('monthFilter').value = 'all';
    document.querySelectorAll('.pill').forEach(function(p) { p.classList.remove('active'); });
    document.querySelector('.pill').classList.add('active');
    filtered = ALL_EVENTS.slice();
    document.getElementById('gridTitle').childNodes[0].textContent = 'All Events ';
    renderGrid();
  }

  /* ════════════════════════════════
     BOOKING MODAL
  ════════════════════════════════ */

  function openModal(id) {
    currentEvent = ALL_EVENTS.find(function(ev) { return ev.id === id; });
    if (!currentEvent) return;
    document.getElementById('modalEventName').textContent = currentEvent.name;
    document.getElementById('modalDate').value = currentEvent.date;
    document.getElementById('mpesaBox').style.display = 'none';
    document.querySelector('.modal-actions').style.display = 'flex';
    document.getElementById('bookingModal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('bookingModal').classList.remove('open');
    currentEvent = null;
  }

  function confirmBooking() {
    var name    = document.getElementById('modalName').value.trim();
    var email   = document.getElementById('modalEmail').value.trim();
    var tickets = document.getElementById('modalTickets').value;
    if (!name || !email) { alert('Please fill in your name and email.'); return; }

    var booking = {
      id:         'SQ' + Math.floor(100000 + Math.random() * 900000),
      attraction: currentEvent.name,
      slug:       currentEvent.id,
      checkIn:    currentEvent.date,
      checkOut:   currentEvent.date,
      guests:     tickets + ' ticket(s)',
      status:     'Confirmed',
      bookedAt:   new Date().toISOString()
    };

    var existing = [];
    try { existing = JSON.parse(localStorage.getItem('sq_bookings') || '[]'); } catch(e) {}
    existing.unshift(booking);
    localStorage.setItem('sq_bookings', JSON.stringify(existing));

    var txId = 'MP' + booking.id;
    document.getElementById('mpesaTxId').textContent = txId;
    document.getElementById('mpesaBox').style.display = 'block';
    document.querySelector('.modal-actions').style.display = 'none';
  }

  document.getElementById('bookingModal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  /* ════════════════════════════════
     HELPERS
  ════════════════════════════════ */

  function formatDate(dateStr) {
    if (!dateStr) return 'Date TBC';
    var d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString('en-KE', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  function normCategory(cat) {
    cat = (cat || '').toLowerCase();
    if (cat.includes('sport') || cat.includes('rally') || cat.includes('race') || cat.includes('marathon')) return 'sports';
    if (cat.includes('music') || cat.includes('arts') || cat.includes('concert') || cat.includes('fashion')) return 'music';
    if (cat.includes('food') || cat.includes('drink') || cat.includes('culinary')) return 'food';
    if (cat.includes('wild') || cat.includes('safari') || cat.includes('nature')) return 'wildlife';
    if (cat.includes('cultur') || cat.includes('festival') || cat.includes('heritage')) return 'cultural';
    return 'other';
  }

  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  function monthName(m) {
    var names = {'01':'January','02':'February','03':'March','04':'April','05':'May','06':'June',
                 '07':'July','08':'August','09':'September','10':'October','11':'November','12':'December'};
    return names[m] || m;
  }

  /* ── Auth guard on booking ── */
  var _origConfirm = confirmBooking;
  confirmBooking = function() {
    if (!window.Auth || Auth.isLoggedIn()) { _origConfirm(); return; }
    var tickets = document.getElementById('modalTickets') ? document.getElementById('modalTickets').value : '1';
    var payload = { eventId: currentEvent ? currentEvent.id : '', eventName: currentEvent ? currentEvent.name : '', date: currentEvent ? currentEvent.date : '', tickets: tickets };
    Auth.requireAuth({ action: 'book', data: payload }, function() { _origConfirm(); });
  };

  /* ── Navbar scroll ── */
  window.addEventListener('scroll', function() {
    var nb = document.getElementById('navbar');
    if (nb) nb.style.boxShadow = window.scrollY > 10 ? '0 4px 20px rgba(0,0,0,.12)' : '0 2px 12px rgba(0,0,0,.07)';
  });

  /* ── INIT ── */
  loadEvents();
</script>

<script src="nav-auth.js"></script>

</body>
